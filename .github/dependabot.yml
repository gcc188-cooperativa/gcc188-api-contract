version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    groups: { tooling: { patterns: ['*'] } }
  - package-ecosystem: npm
    directory: /ts
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
    groups: { ts: { patterns: ['*'] } }
  - package-ecosystem: gradle
    directory: /java
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(deps)' }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: 'chore(ci)' }
