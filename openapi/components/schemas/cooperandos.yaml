CooperandoResumo:
  type: object
  required:
    - id
    - matricula
    - nome
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    matricula:
      type: string
    nome:
      type: string
  examples:
    - id: 1
      matricula: C-0001
      nome: João Pereira
Cooperando:
  type: object
  required:
    - id
    - usuario_id
    - matricula
    - nome
    - cpf
    - data_ingresso
    - ativo
    - criado_em
    - atualizado_em
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
      readOnly: true
    usuario_id:
      type: integer
      format: int64
      minimum: 1
    matricula:
      type: string
      maxLength: 20
    nome:
      type: string
      maxLength: 120
    cpf:
      type: string
      pattern: ^[0-9]{11}$
    telefone:
      type:
        - string
        - 'null'
      maxLength: 20
    data_ingresso:
      type: string
      format: date
    ativo:
      type: boolean
    criado_em:
      type: string
      format: date-time
      readOnly: true
    atualizado_em:
      type: string
      format: date-time
      readOnly: true
  examples:
    - id: 1
      usuario_id: 2
      matricula: C-0001
      nome: João Pereira
      cpf: '12345678909'
      telefone: '35999990000'
      data_ingresso: '2024-03-01'
      ativo: true
      criado_em: '2026-11-10T13:00:00Z'
      atualizado_em: '2026-11-10T13:00:00Z'
CooperandoDados:
  type: object
  required:
    - matricula
    - nome
    - cpf
    - data_ingresso
  properties:
    matricula:
      type: string
      minLength: 1
      maxLength: 20
    nome:
      type: string
      minLength: 1
      maxLength: 120
    cpf:
      type: string
      pattern: ^[0-9]{11}$
      description: Somente dígitos.
    telefone:
      type:
        - string
        - 'null'
      maxLength: 20
    data_ingresso:
      type: string
      format: date
  examples:
    - matricula: C-0001
      nome: João Pereira
      cpf: '12345678909'
      telefone: '35999990000'
      data_ingresso: '2024-03-01'
CooperandoCriacao:
  allOf:
    - $ref: '#/CooperandoDados'
    - type: object
      required:
        - usuario
      properties:
        usuario:
          type: object
          required:
            - email
            - senha
          properties:
            email:
              type: string
              format: email
              maxLength: 160
            senha:
              type: string
              format: password
              minLength: 12
              maxLength: 72
  description: Cadastra o cooperando e o usuário MOTORISTA em uma única transação (RN14).
  examples:
    - matricula: C-0001
      nome: João Pereira
      cpf: '12345678909'
      telefone: '35999990000'
      data_ingresso: '2024-03-01'
      usuario:
        email: joao@cooperativa.example
        senha: senha-temporaria-1
CooperandoPagina:
  type: object
  required:
    - content
    - page
    - size
    - total_elements
    - total_pages
  properties:
    content:
      type: array
      items:
        $ref: '#/Cooperando'
    page:
      type: integer
      minimum: 0
      description: Número da página, iniciando em 0.
    size:
      type: integer
      minimum: 1
      maximum: 100
    total_elements:
      type: integer
      format: int64
      minimum: 0
    total_pages:
      type: integer
      minimum: 0
  examples:
    - content:
        - id: 1
          usuario_id: 2
          matricula: C-0001
          nome: João Pereira
          cpf: '12345678909'
          telefone: '35999990000'
          data_ingresso: '2024-03-01'
          ativo: true
          criado_em: '2026-11-10T13:00:00Z'
          atualizado_em: '2026-11-10T13:00:00Z'
      page: 0
      size: 20
      total_elements: 1
      total_pages: 1
