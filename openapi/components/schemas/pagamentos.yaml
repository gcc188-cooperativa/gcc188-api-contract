PagamentoStatus:
  type: string
  enum:
    - PREVISTO
    - PAGO
    - REPASSADO
    - CANCELADO
Pagamento:
  type: object
  description: '"Em atraso" não é um estado: é derivado de status PREVISTO com vencimento anterior a hoje (P5).'
  required:
    - id
    - contrato_id
    - numero_parcela
    - data_vencimento
    - valor_bruto
    - valor_taxa
    - valor_liquido
    - status
    - versao
    - criado_em
    - atualizado_em
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
      readOnly: true
    contrato_id:
      type: integer
      format: int64
      minimum: 1
    numero_parcela:
      type: integer
      minimum: 1
    data_vencimento:
      type: string
      format: date
    valor_bruto:
      type: number
      multipleOf: 0.01
      exclusiveMinimum: 0
      description: Valor em reais com duas casas decimais, maior que zero (D39).
    valor_taxa:
      type: number
      multipleOf: 0.01
      minimum: 0
      description: Valor em reais com duas casas decimais (D39).
    valor_liquido:
      type: number
      multipleOf: 0.01
      description: valor_bruto − valor_taxa (RN03).
    status:
      $ref: '#/PagamentoStatus'
    data_baixa:
      type:
        - string
        - 'null'
      format: date
    baixado_por_id:
      type:
        - integer
        - 'null'
      format: int64
      minimum: 1
    data_repasse:
      type:
        - string
        - 'null'
      format: date
    repassado_por_id:
      type:
        - integer
        - 'null'
      format: int64
      minimum: 1
    observacao:
      type:
        - string
        - 'null'
      maxLength: 300
    versao:
      type: integer
      format: int64
      minimum: 0
      description: Versão para concorrência otimista (D13). Obrigatória em PUT; divergência responde 409.
    criado_em:
      type: string
      format: date-time
      readOnly: true
    atualizado_em:
      type: string
      format: date-time
      readOnly: true
  examples:
    - id: 10
      contrato_id: 5
      numero_parcela: 1
      data_vencimento: '2026-12-10'
      valor_bruto: 2000
      valor_taxa: 200
      valor_liquido: 1800
      status: PREVISTO
      data_baixa: null
      baixado_por_id: null
      data_repasse: null
      repassado_por_id: null
      observacao: null
      versao: 0
      criado_em: '2026-11-10T13:00:00Z'
      atualizado_em: '2026-11-10T13:00:00Z'
BaixaRequest:
  type: object
  required:
    - data_baixa
  properties:
    data_baixa:
      type: string
      format: date
    observacao:
      type:
        - string
        - 'null'
      maxLength: 300
  examples:
    - data_baixa: '2026-12-10'
      observacao: Pago via transferência
RepasseRequest:
  type: object
  required:
    - data_repasse
  properties:
    data_repasse:
      type: string
      format: date
  examples:
    - data_repasse: '2026-12-12'
EstornoRequest:
  type: object
  required:
    - justificativa
  properties:
    justificativa:
      type: string
      minLength: 1
      maxLength: 300
  examples:
    - justificativa: Baixa registrada na parcela errada
PagamentoPagina:
  type: object
  required:
    - content
    - page
    - size
    - total_elements
    - total_pages
  properties:
    content:
      type: array
      items:
        $ref: '#/Pagamento'
    page:
      type: integer
      minimum: 0
      description: Número da página, iniciando em 0.
    size:
      type: integer
      minimum: 1
      maximum: 100
    total_elements:
      type: integer
      format: int64
      minimum: 0
    total_pages:
      type: integer
      minimum: 0
  examples:
    - content:
        - id: 10
          contrato_id: 5
          numero_parcela: 1
          data_vencimento: '2026-12-10'
          valor_bruto: 2000
          valor_taxa: 200
          valor_liquido: 1800
          status: PREVISTO
          data_baixa: null
          baixado_por_id: null
          data_repasse: null
          repassado_por_id: null
          observacao: null
          versao: 0
          criado_em: '2026-11-10T13:00:00Z'
          atualizado_em: '2026-11-10T13:00:00Z'
      page: 0
      size: 20
      total_elements: 1
      total_pages: 1
