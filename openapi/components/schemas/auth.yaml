LoginRequest:
  type: object
  required:
    - email
    - senha
  properties:
    email:
      type: string
      format: email
      maxLength: 160
    senha:
      type: string
      format: password
      maxLength: 72
  examples:
    - email: maria@cooperativa.example
      senha: uma-senha-longa-123
AlterarSenhaRequest:
  type: object
  required:
    - senha_atual
    - nova_senha
  properties:
    senha_atual:
      type: string
      format: password
    nova_senha:
      type: string
      format: password
      minLength: 12
      maxLength: 72
  examples:
    - senha_atual: senha-temporaria-1
      nova_senha: uma-senha-longa-123
SessaoUsuario:
  type: object
  description: Usuário autenticado; necessário porque o token não é legível pelo navegador.
  required:
    - usuario_id
    - nome
    - email
    - papel
    - vinculo_id
    - deve_trocar_senha
  properties:
    usuario_id:
      type: integer
      format: int64
      minimum: 1
    nome:
      type: string
    email:
      type: string
      format: email
    papel:
      $ref: usuarios.yaml#/Papel
    vinculo_id:
      type:
        - integer
        - 'null'
      format: int64
      description: Id do cooperando (MOTORISTA) ou do cliente (CLIENTE); nulo para ADMINISTRADOR e FINANCEIRO.
    deve_trocar_senha:
      type: boolean
  examples:
    - usuario_id: 1
      nome: Maria Souza
      email: maria@cooperativa.example
      papel: FINANCEIRO
      vinculo_id: null
      deve_trocar_senha: false
