ClienteResumo:
  type: object
  required:
    - id
    - nome
    - documento
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    nome:
      type: string
    documento:
      type: string
  examples:
    - id: 1
      nome: Transportes Alfa Ltda
      documento: '12345678000195'
Cliente:
  type: object
  description:
    Ao motorista, a API devolve somente a identificação (id, nome, documento); os demais campos vêm nulos
    (RN10).
  required:
    - id
    - usuario_id
    - nome
    - documento
    - ativo
    - criado_em
    - atualizado_em
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
      readOnly: true
    usuario_id:
      type: integer
      format: int64
      minimum: 1
    nome:
      type: string
      maxLength: 120
    documento:
      type: string
      pattern: ^([0-9]{11}|[0-9]{14})$
      description: CPF ou CNPJ, somente dígitos.
    telefone:
      type:
        - string
        - 'null'
      maxLength: 20
    email_contato:
      type:
        - string
        - 'null'
      format: email
      maxLength: 160
    ativo:
      type: boolean
    criado_em:
      type: string
      format: date-time
      readOnly: true
    atualizado_em:
      type: string
      format: date-time
      readOnly: true
  examples:
    - id: 1
      usuario_id: 3
      nome: Transportes Alfa Ltda
      documento: '12345678000195'
      telefone: '3532220000'
      email_contato: contato@alfa.example
      ativo: true
      criado_em: '2026-11-10T13:00:00Z'
      atualizado_em: '2026-11-10T13:00:00Z'
ClienteDados:
  type: object
  required:
    - nome
    - documento
  properties:
    nome:
      type: string
      minLength: 1
      maxLength: 120
    documento:
      type: string
      pattern: ^([0-9]{11}|[0-9]{14})$
    telefone:
      type:
        - string
        - 'null'
      maxLength: 20
    email_contato:
      type:
        - string
        - 'null'
      format: email
      maxLength: 160
  examples:
    - nome: Transportes Alfa Ltda
      documento: '12345678000195'
      telefone: '3532220000'
      email_contato: contato@alfa.example
ClienteCriacao:
  allOf:
    - $ref: '#/ClienteDados'
    - type: object
      required:
        - usuario
      properties:
        usuario:
          type: object
          required:
            - email
            - senha
          properties:
            email:
              type: string
              format: email
              maxLength: 160
            senha:
              type: string
              format: password
              minLength: 12
              maxLength: 72
  description: Cadastra o cliente e o usuário CLIENTE em uma única transação (RN14).
  examples:
    - nome: Transportes Alfa Ltda
      documento: '12345678000195'
      telefone: '3532220000'
      email_contato: contato@alfa.example
      usuario:
        email: financeiro@alfa.example
        senha: senha-temporaria-1
ClientePagina:
  type: object
  required:
    - content
    - page
    - size
    - total_elements
    - total_pages
  properties:
    content:
      type: array
      items:
        $ref: '#/Cliente'
    page:
      type: integer
      minimum: 0
      description: Número da página, iniciando em 0.
    size:
      type: integer
      minimum: 1
      maximum: 100
    total_elements:
      type: integer
      format: int64
      minimum: 0
    total_pages:
      type: integer
      minimum: 0
  examples:
    - content:
        - id: 1
          usuario_id: 3
          nome: Transportes Alfa Ltda
          documento: '12345678000195'
          telefone: '3532220000'
          email_contato: contato@alfa.example
          ativo: true
          criado_em: '2026-11-10T13:00:00Z'
          atualizado_em: '2026-11-10T13:00:00Z'
      page: 0
      size: 20
      total_elements: 1
      total_pages: 1
