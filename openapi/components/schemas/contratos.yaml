Modalidade:
  type: string
  enum:
    - UNICO
    - MENSAL
TaxaTipo:
  type: string
  enum:
    - PERCENTUAL
    - FIXO
ContratoStatus:
  type: string
  enum:
    - RASCUNHO
    - PENDENTE_APROVACAO
    - ATIVO
    - ENCERRADO
    - CANCELADO
ContratoEntrada:
  type: object
  description:
    Dados editáveis de um contrato em RASCUNHO. As regras entre campos (RN02, RN03, RN05) são validadas
    pela API e respondem 422.
  required:
    - cooperando_id
    - cliente_id
    - descricao
    - valor_total
    - modalidade
    - num_parcelas
    - data_inicio
    - taxa_tipo
    - taxa_valor
  properties:
    cooperando_id:
      type: integer
      format: int64
      minimum: 1
    cliente_id:
      type: integer
      format: int64
      minimum: 1
    descricao:
      type: string
      minLength: 1
      maxLength: 500
    valor_total:
      type: number
      multipleOf: 0.01
      exclusiveMinimum: 0
      description: Valor em reais com duas casas decimais, maior que zero (D39).
    modalidade:
      $ref: '#/Modalidade'
    num_parcelas:
      type: integer
      minimum: 1
      description: 1 se UNICO; 2 ou mais se MENSAL (RN05).
    dia_vencimento:
      type:
        - integer
        - 'null'
      minimum: 1
      maximum: 28
      description: Obrigatório se MENSAL.
    data_inicio:
      type: string
      format: date
    data_fim:
      type:
        - string
        - 'null'
      format: date
    taxa_tipo:
      $ref: '#/TaxaTipo'
    taxa_valor:
      type: number
      multipleOf: 0.01
      exclusiveMinimum: 0
      description:
        Percentual (até 100) ou valor fixo por pagamento, conforme taxa_tipo (RN02). A taxa nunca excede
        o bruto da parcela (RN03).
  examples:
    - cooperando_id: 1
      cliente_id: 1
      descricao: Transporte de funcionários, rota Lavras–Campo Belo
      valor_total: 6000
      modalidade: MENSAL
      num_parcelas: 3
      dia_vencimento: 10
      data_inicio: '2026-12-01'
      data_fim: '2027-02-28'
      taxa_tipo: PERCENTUAL
      taxa_valor: 10
ContratoAtualizacao:
  allOf:
    - $ref: '#/ContratoEntrada'
    - type: object
      required:
        - versao
      properties:
        versao:
          type: integer
          format: int64
          minimum: 0
          description: Versão para concorrência otimista (D13). Obrigatória em PUT; divergência responde 409.
  examples:
    - cooperando_id: 1
      cliente_id: 1
      descricao: Transporte de funcionários, rota Lavras–Campo Belo
      valor_total: 6000
      modalidade: MENSAL
      num_parcelas: 3
      dia_vencimento: 10
      data_inicio: '2026-12-01'
      data_fim: '2027-02-28'
      taxa_tipo: PERCENTUAL
      taxa_valor: 10
      versao: 0
Contrato:
  allOf:
    - $ref: '#/ContratoEntrada'
    - type: object
      required:
        - id
        - status
        - criado_por_id
        - versao
        - criado_em
        - atualizado_em
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        status:
          $ref: '#/ContratoStatus'
        motivo_reprovacao:
          type:
            - string
            - 'null'
          maxLength: 300
        criado_por_id:
          type: integer
          format: int64
          minimum: 1
        aprovado_por_id:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 1
        aprovado_em:
          type:
            - string
            - 'null'
          format: date-time
          readOnly: true
        versao:
          type: integer
          format: int64
          minimum: 0
          description: Versão para concorrência otimista (D13). Obrigatória em PUT; divergência responde 409.
        criado_em:
          type: string
          format: date-time
          readOnly: true
        atualizado_em:
          type: string
          format: date-time
          readOnly: true
  examples:
    - cooperando_id: 1
      cliente_id: 1
      descricao: Transporte de funcionários, rota Lavras–Campo Belo
      valor_total: 6000
      modalidade: MENSAL
      num_parcelas: 3
      dia_vencimento: 10
      data_inicio: '2026-12-01'
      data_fim: '2027-02-28'
      taxa_tipo: PERCENTUAL
      taxa_valor: 10
      id: 5
      status: ATIVO
      motivo_reprovacao: null
      criado_por_id: 2
      aprovado_por_id: 1
      aprovado_em: '2026-11-10T13:00:00Z'
      versao: 1
      criado_em: '2026-11-10T13:00:00Z'
      atualizado_em: '2026-11-10T13:00:00Z'
ContratoDetalhe:
  allOf:
    - $ref: '#/Contrato'
    - type: object
      required:
        - cooperando
        - cliente
        - pagamentos
      properties:
        cooperando:
          $ref: cooperandos.yaml#/CooperandoResumo
        cliente:
          $ref: clientes.yaml#/ClienteResumo
        pagamentos:
          type: array
          items:
            $ref: pagamentos.yaml#/Pagamento
  examples:
    - cooperando_id: 1
      cliente_id: 1
      descricao: Transporte de funcionários, rota Lavras–Campo Belo
      valor_total: 6000
      modalidade: MENSAL
      num_parcelas: 3
      dia_vencimento: 10
      data_inicio: '2026-12-01'
      data_fim: '2027-02-28'
      taxa_tipo: PERCENTUAL
      taxa_valor: 10
      id: 5
      status: ATIVO
      motivo_reprovacao: null
      criado_por_id: 2
      aprovado_por_id: 1
      aprovado_em: '2026-11-10T13:00:00Z'
      versao: 1
      criado_em: '2026-11-10T13:00:00Z'
      atualizado_em: '2026-11-10T13:00:00Z'
      cooperando:
        id: 1
        matricula: C-0001
        nome: João Pereira
      cliente:
        id: 1
        nome: Transportes Alfa Ltda
        documento: '12345678000195'
      pagamentos:
        - id: 10
          contrato_id: 5
          numero_parcela: 1
          data_vencimento: '2026-12-10'
          valor_bruto: 2000
          valor_taxa: 200
          valor_liquido: 1800
          status: PREVISTO
          data_baixa: null
          baixado_por_id: null
          data_repasse: null
          repassado_por_id: null
          observacao: null
          versao: 0
          criado_em: '2026-11-10T13:00:00Z'
          atualizado_em: '2026-11-10T13:00:00Z'
ReprovacaoRequest:
  type: object
  required:
    - motivo
  properties:
    motivo:
      type: string
      minLength: 1
      maxLength: 300
  examples:
    - motivo: Taxa divergente do acordo com o cliente
ContratoPagina:
  type: object
  required:
    - content
    - page
    - size
    - total_elements
    - total_pages
  properties:
    content:
      type: array
      items:
        $ref: '#/Contrato'
    page:
      type: integer
      minimum: 0
      description: Número da página, iniciando em 0.
    size:
      type: integer
      minimum: 1
      maximum: 100
    total_elements:
      type: integer
      format: int64
      minimum: 0
    total_pages:
      type: integer
      minimum: 0
  examples:
    - content:
        - cooperando_id: 1
          cliente_id: 1
          descricao: Transporte de funcionários, rota Lavras–Campo Belo
          valor_total: 6000
          modalidade: MENSAL
          num_parcelas: 3
          dia_vencimento: 10
          data_inicio: '2026-12-01'
          data_fim: '2027-02-28'
          taxa_tipo: PERCENTUAL
          taxa_valor: 10
          id: 5
          status: ATIVO
          motivo_reprovacao: null
          criado_por_id: 2
          aprovado_por_id: 1
          aprovado_em: '2026-11-10T13:00:00Z'
          versao: 1
          criado_em: '2026-11-10T13:00:00Z'
          atualizado_em: '2026-11-10T13:00:00Z'
      page: 0
      size: 20
      total_elements: 1
      total_pages: 1
