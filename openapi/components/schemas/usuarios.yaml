Papel:
  type: string
  enum:
    - ADMINISTRADOR
    - FINANCEIRO
    - MOTORISTA
    - CLIENTE
Usuario:
  type: object
  required:
    - id
    - nome
    - email
    - papel
    - ativo
    - deve_trocar_senha
    - versao
    - criado_em
    - atualizado_em
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
      readOnly: true
    nome:
      type: string
      maxLength: 120
    email:
      type: string
      format: email
      maxLength: 160
    papel:
      $ref: '#/Papel'
    ativo:
      type: boolean
    deve_trocar_senha:
      type: boolean
    versao:
      type: integer
      format: int64
      minimum: 0
      description: Versão para concorrência otimista (D13). Obrigatória em PUT; divergência responde 409.
    criado_em:
      type: string
      format: date-time
      readOnly: true
    atualizado_em:
      type: string
      format: date-time
      readOnly: true
  examples:
    - id: 1
      nome: Maria Souza
      email: maria@cooperativa.example
      papel: FINANCEIRO
      ativo: true
      deve_trocar_senha: false
      versao: 0
      criado_em: '2026-11-10T13:00:00Z'
      atualizado_em: '2026-11-10T13:00:00Z'
UsuarioCriacao:
  type: object
  required:
    - nome
    - email
    - senha
    - papel
  properties:
    nome:
      type: string
      minLength: 1
      maxLength: 120
    email:
      type: string
      format: email
      maxLength: 160
    senha:
      type: string
      format: password
      minLength: 12
      maxLength: 72
      description: Senha temporária; o usuário deve trocá-la no primeiro acesso.
    papel:
      $ref: '#/Papel'
  examples:
    - nome: Maria Souza
      email: maria@cooperativa.example
      senha: senha-temporaria-1
      papel: FINANCEIRO
UsuarioAtualizacao:
  type: object
  required:
    - nome
    - email
    - papel
    - versao
  properties:
    nome:
      type: string
      minLength: 1
      maxLength: 120
    email:
      type: string
      format: email
      maxLength: 160
    papel:
      $ref: '#/Papel'
    versao:
      type: integer
      format: int64
      minimum: 0
      description: Versão para concorrência otimista (D13). Obrigatória em PUT; divergência responde 409.
  examples:
    - nome: Maria Souza
      email: maria@cooperativa.example
      papel: FINANCEIRO
      versao: 0
SituacaoRequest:
  type: object
  required:
    - ativo
  properties:
    ativo:
      type: boolean
  examples:
    - ativo: false
RedefinicaoSenhaRequest:
  type: object
  required:
    - senha_temporaria
  properties:
    senha_temporaria:
      type: string
      format: password
      minLength: 12
      maxLength: 72
  examples:
    - senha_temporaria: senha-temporaria-2
UsuarioPagina:
  type: object
  required:
    - content
    - page
    - size
    - total_elements
    - total_pages
  properties:
    content:
      type: array
      items:
        $ref: '#/Usuario'
    page:
      type: integer
      minimum: 0
      description: Número da página, iniciando em 0.
    size:
      type: integer
      minimum: 1
      maximum: 100
    total_elements:
      type: integer
      format: int64
      minimum: 0
    total_pages:
      type: integer
      minimum: 0
  examples:
    - content:
        - id: 1
          nome: Maria Souza
          email: maria@cooperativa.example
          papel: FINANCEIRO
          ativo: true
          deve_trocar_senha: false
          versao: 0
          criado_em: '2026-11-10T13:00:00Z'
          atualizado_em: '2026-11-10T13:00:00Z'
      page: 0
      size: 20
      total_elements: 1
      total_pages: 1
