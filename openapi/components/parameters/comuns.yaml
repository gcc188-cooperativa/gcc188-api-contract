Id:
  name: id
  in: path
  required: true
  description: Identificador numérico do recurso.
  schema:
    type: integer
    format: int64
    minimum: 1
Page:
  name: page
  in: query
  description: Número da página, iniciando em 0.
  schema:
    type: integer
    minimum: 0
    default: 0
Size:
  name: size
  in: query
  description: Tamanho da página (máximo 100).
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
Sort:
  name: sort
  in: query
  description:
    Ordenação `campo,asc|desc`. Somente os campos listados na operação são aceitos; outro valor responde
    400.
  schema:
    type: string
    pattern: ^[a-z_]+(,(asc|desc))?$
