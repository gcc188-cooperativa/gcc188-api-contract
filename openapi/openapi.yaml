openapi: 3.1.0
info:
  title: API da Cooperativa de Transportes
  version: 0.2.0
  summary: Contratos, pagamentos, cooperandos e despesas.
  description: >-
    Contrato da API REST do sistema de gestão da cooperativa (fonte de verdade —
    D06). Autenticação por cookies `HttpOnly`; requisições de escrita exigem
    `X-XSRF-TOKEN` igual ao cookie `XSRF-TOKEN`. JSON em `snake_case`; valores
    monetários como número decimal com duas casas; erros em
    `application/problem+json` (RFC 9457).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Mesma origem do front-end, atrás do proxy reverso (D28).
security:
  - cookieAuth: []
tags:
  - name: autenticacao
    description: Login, renovação, logout e sessão (cookies HttpOnly, CSRF).
  - name: usuarios
    description: CRUD de usuários (módulo A).
  - name: cooperandos
    description: Motoristas associados.
  - name: clientes
    description: Contratantes dos serviços.
  - name: contratos
    description: Contratos, máquina de estados (RN12) e cronograma.
  - name: pagamentos
    description: Baixa, repasse e estorno.
  - name: despesas
    description: Despesas da cooperativa e dos cooperandos.
  - name: relatorios
    description: Extrato, resumo financeiro e inadimplência.
  - name: painel
    description: Indicadores por papel.
