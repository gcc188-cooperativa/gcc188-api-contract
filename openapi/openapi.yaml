  /painel/indicadores:
    $ref: paths/relatorios.yaml#/painel_indicadores
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: ACCESS_TOKEN
      description: >-
        JWT de acesso (15 min), cookie HttpOnly; Secure; SameSite=Strict;
        Path=/api.
    refreshCookie:
      type: apiKey
      in: cookie
      name: REFRESH_TOKEN
      description: Refresh token rotativo (7 dias), cookie HttpOnly; Path=/api/v1/auth.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: >-
        Deve ser igual ao cookie XSRF-TOKEN em POST, PUT, PATCH e DELETE
        autenticados (CA-11).
