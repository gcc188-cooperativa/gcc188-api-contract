  /contratos/{id}:
    $ref: paths/contratos.yaml#/contratos_id
  /contratos/{id}/submissao:
    $ref: paths/contratos.yaml#/contratos_id_submissao
  /contratos/{id}/aprovacao:
    $ref: paths/contratos.yaml#/contratos_id_aprovacao
  /contratos/{id}/reprovacao:
    $ref: paths/contratos.yaml#/contratos_id_reprovacao
  /contratos/{id}/encerramento:
    $ref: paths/contratos.yaml#/contratos_id_encerramento
  /contratos/{id}/cancelamento:
    $ref: paths/contratos.yaml#/contratos_id_cancelamento
  /contratos/{id}/pagamentos:
