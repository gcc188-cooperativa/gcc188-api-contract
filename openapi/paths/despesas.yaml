    tags:
      - despesas
    summary: Atualiza despesa
    description: '**Papéis:** ADMINISTRADOR, FINANCEIRO, MOTORISTA.


      O motorista atualiza apenas as suas.'
    operationId: atualizarDespesa
    x-papeis:
      - ADMINISTRADOR
      - FINANCEIRO
      - MOTORISTA
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
