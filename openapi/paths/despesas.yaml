despesas_id:
  get:
    tags:
      - despesas
    summary: Consulta despesa
    description: '**Papéis:** ADMINISTRADOR, FINANCEIRO, MOTORISTA.'
    operationId: obterDespesa
    x-papeis:
      - ADMINISTRADOR
      - FINANCEIRO
      - MOTORISTA
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
    responses:
      '200':
        description: Consulta realizada.
        content:
