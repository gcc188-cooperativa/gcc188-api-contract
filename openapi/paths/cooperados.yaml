cooperados:
  post:
    tags:
      - cooperados
    summary: Cadastra cooperado e usuário (transação)
    description: '**Papéis:** ADMINISTRADOR.'
    operationId: criarCooperado
    x-papeis:
      - ADMINISTRADOR
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cooperados.yaml#/CooperadoCriacao
    responses:
      '201':
        description: Cooperado criado.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperados.yaml#/Cooperado
        headers:
          Location:
            description: URI do recurso criado.
            schema:
              type: string
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '409':
        $ref: ../components/responses/erros.yaml#/Conflict
      '422':
        $ref: ../components/responses/erros.yaml#/UnprocessableEntity
    security:
      - cookieAuth: []
        csrfHeader: []
  get:
    tags:
      - cooperados
    summary: Lista cooperados
    description: '**Papéis:** ADMINISTRADOR, FINANCEIRO.


      Campos de `sort`: `nome`, `matricula`, `data_ingresso`.'
    operationId: listarCooperados
    x-papeis:
      - ADMINISTRADOR
      - FINANCEIRO
    parameters:
      - name: nome
        in: query
        required: false
        description: Busca parcial por nome.
        schema:
          type: string
      - name: matricula
        in: query
        required: false
        description: Matrícula exata.
        schema:
          type: string
      - name: ativo
        in: query
        required: false
        description: Situação.
        schema:
          type: boolean
      - $ref: ../components/parameters/comuns.yaml#/Page
      - $ref: ../components/parameters/comuns.yaml#/Size
      - $ref: ../components/parameters/comuns.yaml#/Sort
    responses:
      '200':
        description: Consulta realizada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperados.yaml#/CooperadoPagina
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
cooperados_id:
  get:
    tags:
      - cooperados
    summary: Consulta cooperado
    description: '**Papéis:** ADMINISTRADOR, FINANCEIRO, MOTORISTA.


      O motorista consulta apenas o próprio (RN10).'
    operationId: obterCooperado
    x-papeis:
      - ADMINISTRADOR
      - FINANCEIRO
      - MOTORISTA
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
    responses:
      '200':
        description: Consulta realizada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperados.yaml#/Cooperado
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '404':
        $ref: ../components/responses/erros.yaml#/NotFound
  put:
    tags:
      - cooperados
    summary: Atualiza cooperado
    description: '**Papéis:** ADMINISTRADOR.'
    operationId: atualizarCooperado
    x-papeis:
      - ADMINISTRADOR
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cooperados.yaml#/CooperadoDados
    responses:
      '200':
        description: Cooperado atualizado.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperados.yaml#/Cooperado
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '404':
        $ref: ../components/responses/erros.yaml#/NotFound
      '409':
        $ref: ../components/responses/erros.yaml#/Conflict
      '422':
        $ref: ../components/responses/erros.yaml#/UnprocessableEntity
    security:
      - cookieAuth: []
        csrfHeader: []
cooperados_id_situacao:
  patch:
    tags:
      - cooperados
    summary: Inativa ou reativa cooperado
    description: '**Papéis:** ADMINISTRADOR.


      Cooperado inativo não pode ser vinculado a novos contratos (RN13).'
    operationId: alterarSituacaoCooperado
    x-papeis:
      - ADMINISTRADOR
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/usuarios.yaml#/SituacaoRequest
    responses:
      '200':
        description: Situação alterada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperados.yaml#/Cooperado
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '404':
        $ref: ../components/responses/erros.yaml#/NotFound
      '409':
        $ref: ../components/responses/erros.yaml#/Conflict
    security:
      - cookieAuth: []
        csrfHeader: []
