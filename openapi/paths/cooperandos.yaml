cooperandos:
  post:
    tags:
      - cooperandos
    summary: Cadastra cooperando e usuário (transação)
    description: '**Papéis:** ADMINISTRADOR.'
    operationId: criarCooperando
    x-papeis:
      - ADMINISTRADOR
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cooperandos.yaml#/CooperandoCriacao
    responses:
      '201':
        description: Cooperando criado.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperandos.yaml#/Cooperando
        headers:
          Location:
            description: URI do recurso criado.
            schema:
              type: string
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '409':
        $ref: ../components/responses/erros.yaml#/Conflict
      '422':
        $ref: ../components/responses/erros.yaml#/UnprocessableEntity
    security:
      - cookieAuth: []
        csrfHeader: []
  get:
    tags:
      - cooperandos
    summary: Lista cooperandos
    description: '**Papéis:** ADMINISTRADOR, FINANCEIRO.


      Campos de `sort`: `nome`, `matricula`, `data_ingresso`.'
    operationId: listarCooperandos
    x-papeis:
      - ADMINISTRADOR
      - FINANCEIRO
    parameters:
      - name: nome
        in: query
        required: false
        description: Busca parcial por nome.
        schema:
          type: string
      - name: matricula
        in: query
        required: false
        description: Matrícula exata.
        schema:
          type: string
      - name: ativo
        in: query
        required: false
        description: Situação.
        schema:
          type: boolean
      - $ref: ../components/parameters/comuns.yaml#/Page
      - $ref: ../components/parameters/comuns.yaml#/Size
      - $ref: ../components/parameters/comuns.yaml#/Sort
    responses:
      '200':
        description: Consulta realizada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperandos.yaml#/CooperandoPagina
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
cooperandos_id:
  get:
    tags:
      - cooperandos
    summary: Consulta cooperando
    description: '**Papéis:** ADMINISTRADOR, FINANCEIRO, MOTORISTA.


      O motorista consulta apenas o próprio (RN10).'
    operationId: obterCooperando
    x-papeis:
      - ADMINISTRADOR
      - FINANCEIRO
      - MOTORISTA
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
    responses:
      '200':
        description: Consulta realizada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperandos.yaml#/Cooperando
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '404':
        $ref: ../components/responses/erros.yaml#/NotFound
  put:
    tags:
      - cooperandos
    summary: Atualiza cooperando
    description: '**Papéis:** ADMINISTRADOR.'
    operationId: atualizarCooperando
    x-papeis:
      - ADMINISTRADOR
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/cooperandos.yaml#/CooperandoDados
    responses:
      '200':
        description: Cooperando atualizado.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperandos.yaml#/Cooperando
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '404':
        $ref: ../components/responses/erros.yaml#/NotFound
      '409':
        $ref: ../components/responses/erros.yaml#/Conflict
      '422':
        $ref: ../components/responses/erros.yaml#/UnprocessableEntity
    security:
      - cookieAuth: []
        csrfHeader: []
cooperandos_id_situacao:
  patch:
    tags:
      - cooperandos
    summary: Inativa ou reativa cooperando
    description: '**Papéis:** ADMINISTRADOR.


      Cooperando inativo não pode ser vinculado a novos contratos (RN13).'
    operationId: alterarSituacaoCooperando
    x-papeis:
      - ADMINISTRADOR
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/usuarios.yaml#/SituacaoRequest
    responses:
      '200':
        description: Situação alterada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/cooperandos.yaml#/Cooperando
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '404':
        $ref: ../components/responses/erros.yaml#/NotFound
      '409':
        $ref: ../components/responses/erros.yaml#/Conflict
    security:
      - cookieAuth: []
        csrfHeader: []
