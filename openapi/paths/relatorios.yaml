cooperandos_id_extrato:
  get:
    tags:
      - relatorios
    summary: Extrato do cooperando no período
    description: '**Papéis:** ADMINISTRADOR, FINANCEIRO, MOTORISTA.


      O motorista consulta apenas o próprio extrato (RN10).'
    operationId: obterExtratoCooperando
    x-papeis:
      - ADMINISTRADOR
      - FINANCEIRO
      - MOTORISTA
    parameters:
      - $ref: ../components/parameters/comuns.yaml#/Id
      - name: data_inicio
        in: query
        required: true
        description: Início do período (inclusive).
        schema:
          type: string
          format: date
      - name: data_fim
        in: query
        required: true
        description: Fim do período (inclusive).
        schema:
          type: string
          format: date
    responses:
      '200':
        description: Consulta realizada.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/relatorios.yaml#/Extrato
      '400':
        $ref: ../components/responses/erros.yaml#/BadRequest
      '401':
        $ref: ../components/responses/erros.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/erros.yaml#/Forbidden
      '404':
        $ref: ../components/responses/erros.yaml#/NotFound
